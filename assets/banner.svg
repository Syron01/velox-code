<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0f14"/>
      <stop offset="100%" stop-color="#1e2330"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6b8cff"/>
      <stop offset="100%" stop-color="#c792ea"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8eaf6"/>
      <stop offset="100%" stop-color="#a9b9ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" fill="url(#bg)" rx="16"/>

  <!-- Grid lines -->
  <g stroke="rgba(99,120,198,0.07)" stroke-width="1">
    <line x1="0" y1="70" x2="900" y2="70"/>
    <line x1="0" y1="140" x2="900" y2="140"/>
    <line x1="0" y1="210" x2="900" y2="210"/>
    <line x1="225" y1="0" x2="225" y2="280"/>
    <line x1="450" y1="0" x2="450" y2="280"/>
    <line x1="675" y1="0" x2="675" y2="280"/>
  </g>

  <!-- Glow orb left -->
  <circle cx="80" cy="140" r="120" fill="rgba(107,140,255,0.06)"/>
  <!-- Glow orb right -->
  <circle cx="820" cy="140" r="100" fill="rgba(199,146,234,0.06)"/>

  <!-- Lightning bolt icon -->
  <text x="60" y="165" font-size="70" filter="url(#glow)" fill="url(#accent)" font-family="Arial">⚡</text>

  <!-- Main title -->
  <text x="150" y="130" font-family="'Segoe UI', Arial, sans-serif" font-size="56" font-weight="800" fill="url(#textGrad)" letter-spacing="-2">velox</text>
  <text x="330" y="130" font-family="'Segoe UI', Arial, sans-serif" font-size="56" font-weight="800" fill="url(#accent)" letter-spacing="-2">code</text>

  <!-- Tagline -->
  <text x="150" y="162" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#8892b0" letter-spacing="0.5">Lightning-fast code playground for Dart, HTML &amp; JavaScript</text>

  <!-- Feature badges -->
  <g transform="translate(150, 185)">
    <!-- Dart badge -->
    <rect x="0" y="0" width="70" height="24" rx="12" fill="rgba(107,140,255,0.15)" stroke="rgba(107,140,255,0.3)" stroke-width="1"/>
    <text x="35" y="16" font-family="Arial" font-size="12" font-weight="600" fill="#6b8cff" text-anchor="middle">⚡ Dart</text>

    <!-- HTML badge -->
    <rect x="80" y="0" width="70" height="24" rx="12" fill="rgba(199,146,234,0.15)" stroke="rgba(199,146,234,0.3)" stroke-width="1"/>
    <text x="115" y="16" font-family="Arial" font-size="12" font-weight="600" fill="#c792ea" text-anchor="middle">◇ HTML</text>

    <!-- JS badge -->
    <rect x="160" y="0" width="70" height="24" rx="12" fill="rgba(255,203,107,0.15)" stroke="rgba(255,203,107,0.3)" stroke-width="1"/>
    <text x="195" y="16" font-family="Arial" font-size="12" font-weight="600" fill="#ffcb6b" text-anchor="middle">» JS</text>

    <!-- Mobile badge -->
    <rect x="240" y="0" width="90" height="24" rx="12" fill="rgba(82,216,138,0.15)" stroke="rgba(82,216,138,0.3)" stroke-width="1"/>
    <text x="285" y="16" font-family="Arial" font-size="12" font-weight="600" fill="#52d88a" text-anchor="middle">📱 Mobile</text>

    <!-- Dark theme badge -->
    <rect x="340" y="0" width="100" height="24" rx="12" fill="rgba(99,120,198,0.1)" stroke="rgba(99,120,198,0.2)" stroke-width="1"/>
    <text x="390" y="16" font-family="Arial" font-size="12" font-weight="600" fill="#8892b0" text-anchor="middle">🌙 Dark/Light</text>
  </g>

  <!-- Right side: code preview -->
  <g transform="translate(560, 40)">
    <rect x="0" y="0" width="300" height="200" rx="12" fill="#0d0f14" stroke="rgba(99,120,198,0.2)" stroke-width="1"/>
    <!-- Header bar -->
    <rect x="0" y="0" width="300" height="32" rx="12" fill="#181c25"/>
    <rect x="0" y="16" width="300" height="16" fill="#181c25"/>
    <circle cx="16" cy="16" r="5" fill="#ff7070" opacity="0.7"/>
    <circle cx="32" cy="16" r="5" fill="#ffcb6b" opacity="0.7"/>
    <circle cx="48" cy="16" r="5" fill="#52d88a" opacity="0.7"/>
    <text x="150" y="20" font-family="monospace" font-size="11" fill="#4a5280" text-anchor="middle">main.dart</text>
    <!-- Code lines -->
    <text x="16" y="55" font-family="monospace" font-size="11" fill="#c792ea">void</text>
    <text x="48" y="55" font-family="monospace" font-size="11" fill="#82aaff"> main</text>
    <text x="92" y="55" font-family="monospace" font-size="11" fill="#89ddff">() {</text>
    <text x="16" y="75" font-family="monospace" font-size="11" fill="#82aaff">  print</text>
    <text x="60" y="75" font-family="monospace" font-size="11" fill="#89ddff">(</text>
    <text x="68" y="75" font-family="monospace" font-size="11" fill="#a5e075">'Hello ⚡'</text>
    <text x="140" y="75" font-family="monospace" font-size="11" fill="#89ddff">);</text>
    <text x="16" y="95" font-family="monospace" font-size="11" fill="#546e7a">  // Dart is fast!</text>
    <text x="16" y="115" font-family="monospace" font-size="11" fill="#c792ea">  for</text>
    <text x="42" y="115" font-family="monospace" font-size="11" fill="#89ddff"> (</text>
    <text x="52" y="115" font-family="monospace" font-size="11" fill="#c792ea">var</text>
    <text x="72" y="115" font-family="monospace" font-size="11" fill="#e8eaf6"> i = </text>
    <text x="100" y="115" font-family="monospace" font-size="11" fill="#f78c6c">0</text>
    <text x="108" y="115" font-family="monospace" font-size="11" fill="#89ddff">; i &lt; </text>
    <text x="142" y="115" font-family="monospace" font-size="11" fill="#f78c6c">5</text>
    <text x="150" y="115" font-family="monospace" font-size="11" fill="#89ddff">; i++)</text>
    <text x="16" y="135" font-family="monospace" font-size="11" fill="#82aaff">    print</text>
    <text x="66" y="135" font-family="monospace" font-size="11" fill="#89ddff">(i);</text>
    <text x="16" y="155" font-family="monospace" font-size="11" fill="#89ddff">}</text>
    <!-- Output section -->
    <rect x="0" y="170" width="300" height="30" rx="0" fill="#0b0d12"/>
    <rect x="0" y="170" width="300" height="30" rx="12"/>
    <rect x="0" y="170" width="300" height="16" fill="#0b0d12"/>
    <text x="16" y="192" font-family="monospace" font-size="11" fill="#52d88a">› Hello ⚡  0  1  2  3  4</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="276" width="900" height="4" rx="2" fill="url(#accent)" opacity="0.6"/>
</svg>
